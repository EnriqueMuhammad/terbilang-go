  <rect width="760" height="40" rx="14" fill="#292524"/>
  <rect y="20" width="760" height="20" fill="#292524"/>
  <circle cx="22" cy="20" r="6" fill="#ef4444"/>
  <circle cx="42" cy="20" r="6" fill="#eab308"/>
  <circle cx="62" cy="20" r="6" fill="#22c55e"/>
  <text x="84" y="25" fill="#a8a29e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">terbilang</text>
