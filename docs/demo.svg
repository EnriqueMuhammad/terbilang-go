  <text x="40" y="138" fill="#e7e5e4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">terbilang -format -rupiah 1250000</text>
  <text x="24" y="164" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">Rp1.250.000,00</text>
